[structure]
vacuum = 10.0

[structure.fcc]
elements = ["Pt"]
size = [3, 3, 4]

[structure.hcp]
elements = []
size = [3, 3, 4]

[structure.bcc]
elements = []
size = [3, 3, 6]

[generation]
layers_to_swap = 1
num_swaps = 2
only_last_generation = true
swap_elements = ["Cu", "Ag"]

[database]
path = "data/trimetallic.db"
constrain_bottom_layers = 2
constraint_z_tolerance = 0.5
constraint_lowest_z_tolerance = 0.5

[adsorbate]
species = "N"
coords = [[0.0, 0.0, 0.0]]
tag = 0
surface_layers_for_matching = 2
reuse_site_templates_for_two_swap_motifs = false
template_site_match_tolerance = 0.5

[adsorbate.matcher]
ltol = 0.05
stol = 0.1
angle_tol = 5.0
